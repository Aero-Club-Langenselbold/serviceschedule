server.servlet.context-path=/api/v1

# photos of the winch book (the UI scales them down, the service accepts up to 10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# read too large uploads to the end, so the client gets the 413 instead of a reset connection
server.tomcat.max-swallow-size=20MB

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=scheduler
spring.datasource.password=password
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true

app.jwtSecret==========================FANCYSECRETKEY==========================
app.jwtExpirationMs=86400000


logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO
logging.file.path=target/logs/
logging.file.name=app.log

cors.allowed-origins=*

vf.api.url=https://vf.de/interface/rest
vf.api.key=1234