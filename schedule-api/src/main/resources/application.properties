spring.application.name=schedule-api

spring.datasource.url=jdbc:postgresql://localhost:5432/schedule
spring.datasource.username=schedule
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwtSecret==========================FANCYSECRETKEY==========================
app.jwtExpirationMs=86400000

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.file.path=target/logs/
logging.file.name=scheduler.log

server.servlet.context-path=/api/v1

# photos of the winch book (the UI scales them down, the service accepts up to 10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# read too large uploads to the end, so the client gets the 413 instead of a reset connection
server.tomcat.max-swallow-size=20MB

management.endpoints.web.exposure.include=health,info,metrics

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs

cors.allowed-origins=http://localhost:3000,http://localhost:8081

vf.api.url=https://vf.de/interface/rest
vf.api.key=12345