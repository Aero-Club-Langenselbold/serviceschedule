services:
  db:
    image: postgres:latest
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=3x@mpl3S3cur3P@ssw0rd!
      - POSTGRES_USER=schedule
    shm_size: "2gb"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
    healthcheck:
      # TCP on purpose: the temporary server used during first-run init only listens on the unix socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "schedule", "-d", "schedule"]
      interval: 5s
      timeout: 5s
      retries: 12

  schedule-api:
    build:
      context: ./schedule-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      db:
        condition: service_healthy
    shm_size: "1gb"
    volumes:
      - ./volumes/schedule-api:/var/log/schedule-api

  schedule-ui:
    build:
      context: ./
      dockerfile: Dockerfile-nginx
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./schedule-ui/.output/public:/usr/share/nginx/html:ro